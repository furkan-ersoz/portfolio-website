<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Autonomous Work Logger: data sources flow through Claude into daily plans, logs and weekly reports</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a8a"/>
    </marker>
    <style>
      .box { fill: #000; stroke: rgba(255,255,255,0.45); stroke-width: 2; }
      .core { fill: #000; stroke: #ff3b2f; stroke-width: 3; }
      .label { fill: #f5f5f5; font-size: 34px; font-weight: 600; text-anchor: middle; }
      .small { fill: #9a9a9a; font-size: 24px; text-anchor: middle; }
      .head { fill: #9a9a9a; font-size: 22px; font-weight: 600; letter-spacing: 0.16em; text-anchor: middle; }
      .coreText { fill: #ff3b2f; font-size: 46px; font-weight: 700; text-anchor: middle; }
      .line { stroke: #8a8a8a; stroke-width: 2; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#050505"/>

  <!-- sources -->
  <text class="head" x="250" y="150">COLLECT</text>
  <rect class="box" x="90" y="190" width="320" height="100"/><text class="label" x="250" y="252">Clockify</text>
  <rect class="box" x="90" y="320" width="320" height="100"/><text class="label" x="250" y="382">GitHub</text>
  <rect class="box" x="90" y="450" width="320" height="100"/><text class="label" x="250" y="512">Calendar · Drive</text>
  <rect class="box" x="90" y="580" width="320" height="100"/><text class="label" x="250" y="642">Obsidian · Sheets</text>

  <!-- core -->
  <path class="line" d="M412 240 C520 240 520 400 585 420"/>
  <path class="line" d="M412 370 C500 370 530 430 585 440"/>
  <path class="line" d="M412 500 C500 500 530 460 585 460"/>
  <path class="line" d="M412 630 C520 630 520 500 585 480"/>
  <rect class="core" x="590" y="330" width="420" height="240"/>
  <text class="coreText" x="800" y="430">Claude</text>
  <text class="small" x="800" y="475">summarise · plan · analyse</text>
  <text class="small" x="800" y="515">Google Apps Script</text>

  <!-- outputs -->
  <text class="head" x="1350" y="150">DELIVER</text>
  <path class="line" d="M1012 400 C1100 400 1110 245 1185 240"/>
  <path class="line" d="M1012 450 C1110 450 1120 440 1185 440"/>
  <path class="line" d="M1012 500 C1100 500 1110 640 1185 640"/>
  <rect class="box" x="1190" y="190" width="320" height="100"/><text class="label" x="1350" y="236">Morning plan</text><text class="small" x="1350" y="270">08:00 · scored tasks</text>
  <rect class="box" x="1190" y="390" width="320" height="100"/><text class="label" x="1350" y="436">Daily log</text><text class="small" x="1350" y="470">22:00 · to Obsidian</text>
  <rect class="box" x="1190" y="590" width="320" height="100"/><text class="label" x="1350" y="636">Weekly report</text><text class="small" x="1350" y="670">Sunday · charts + email</text>
</svg>
