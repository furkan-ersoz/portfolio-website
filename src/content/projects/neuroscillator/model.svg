<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 490" width="440" height="490" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How each frame predictor works</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#a3a3a3"/>
    </marker>
    <style>
      .box { fill: #000; stroke: rgba(255,255,255,0.35); stroke-width: 1; }
      .input { stroke: rgba(255,255,255,0.85); }
      .optional { stroke-dasharray: 4 3; }
      .output { stroke: #ff3b2f; }
      .title { fill: #f5f5f5; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #a3a3a3; font-size: 10.5px; text-anchor: middle; }
      .tag { fill: #ff3b2f; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-anchor: middle; }
      .line { stroke: #a3a3a3; stroke-width: 1; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- inputs -->
  <rect class="box input" x="0.5" y="10.5" width="135" height="50"/>
  <text class="title" x="68" y="32">Target sound</text>
  <text class="sub" x="68" y="48">mel-spectrogram</text>

  <rect class="box input" x="152.5" y="10.5" width="135" height="50"/>
  <text class="title" x="220" y="32">Cheat sheet</text>
  <text class="sub" x="220" y="48">render so far</text>

  <rect class="box input" x="304.5" y="10.5" width="135" height="50"/>
  <text class="title" x="372" y="32">Earlier params</text>
  <text class="sub" x="372" y="48">from previous frames</text>

  <!-- audio path -->
  <path class="line" d="M68 61 V98"/>
  <path class="line" d="M220 61 V98"/>
  <rect class="box" x="0.5" y="100.5" width="287" height="56"/>
  <text class="title" x="144" y="123">CNN encoder</text>
  <text class="sub" x="144" y="140">3 × Conv · BatchNorm · ReLU · MaxPool</text>

  <path class="line" d="M144 157 V184"/>
  <rect class="box" x="0.5" y="186.5" width="287" height="50"/>
  <text class="title" x="144" y="208">Pooling</text>
  <text class="sub" x="144" y="224">across frequency, or as statistics</text>

  <path class="line" d="M144 237 V264"/>
  <rect class="box optional" x="0.5" y="266.5" width="287" height="50"/>
  <text class="title" x="144" y="288">GRU over time</text>
  <text class="sub" x="144" y="304">optional · follows how the sound evolves</text>

  <!-- parameter path -->
  <path class="line" d="M372 61 V184"/>
  <rect class="box" x="304.5" y="186.5" width="135" height="50"/>
  <text class="title" x="372" y="208">Conditioning</text>
  <text class="sub" x="372" y="224">linear projection</text>

  <!-- fusion -->
  <path class="line" d="M144 317 V344"/>
  <path class="line" d="M372 237 V344"/>
  <rect class="box" x="0.5" y="346.5" width="439" height="50"/>
  <text class="title" x="220" y="368">Fusion</text>
  <text class="sub" x="220" y="384">Linear · ReLU · Dropout — combines sound and context</text>

  <!-- outputs -->
  <path class="line" d="M106 397 V424"/>
  <path class="line" d="M334 397 V424"/>
  <rect class="box output" x="0.5" y="426.5" width="211" height="62"/>
  <text class="tag" x="106" y="442">OUTPUT</text>
  <text class="title" x="106" y="460">Continuous values</text>
  <text class="sub" x="106" y="477">knobs like cutoff, attack time</text>

  <rect class="box output" x="228.5" y="426.5" width="211" height="62"/>
  <text class="tag" x="334" y="442">OUTPUT</text>
  <text class="title" x="334" y="460">Categorical choices</text>
  <text class="sub" x="334" y="477">waveform, filter type, LFO shape</text>
</svg>
